      - name: Modelleri release (etiket - models) uzerinden indir
        run: |
          mkdir -p models
          if gh release download models --repo "$GITHUB_REPOSITORY" --dir models --clobber; then
            echo "Release 'models' indirildi."
          else
            echo "::warning::Release 'models' indirilemedi, depodaki models/ klasorune bakiliyor."
          fi
          ls -la models
          N=$(ls models | wc -l)
          if [ "$N" -eq 0 ]; then
            echo "::error::models klasoru bos. Release etiketi 'models' olmali ve 6 model dosyasi icermeli."
            exit 1
          fi

      - name: Blender + DragonFF kur
        run: |
          sudo apt-get update -y
          sudo apt-get install -y blender unzip curl
          blender --version | head -1
          BV=$(blender --version | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
          ADDON="$HOME/.config/blender/$BV/scripts/addons"
          mkdir -p "$ADDON"
          curl -fL --retry 3 -o dff.zip https://github.com/Parik27/DragonFF/archive/refs/heads/master.zip
          unzip -q dff.zip
          rm -rf "$ADDON/DragonFF"
          mv DragonFF-master "$ADDON/DragonFF"
          blender -b --python-expr "import bpy; bpy.ops.preferences.addon_enable(module='DragonFF'); bpy.ops.wm.save_userpref(); print('DFF ADDON OK')" || echo "::warning::DragonFF etkinlestirilemedi (yedek: obj/blend cikar)"

      - name: Modelleri isle (olcek, sadelestirme, doku)
        run: |
          mkdir -p out
          set +e
          blender -b --python bv/tools/process_models.py -- bv/config/models.json models out bv/models_proc 2>&1 | tee model_log.txt
          python3 bv/tools/gen_gamedata.py bv/config/models.json out/gamedata
          cp -r bv/assets out/assets
          cp -r bv/server out/server
          exit 0

      - name: Hata ozeti
        if: always()
        run: |
          {
            echo "## Hata ozeti - modeller"
            if [ -f model_log.txt ]; then
              echo "Basarisiz modeller:"; echo '```'
              grep '^REPORT' model_log.txt | grep -E '"ok": false|"dff": false' || echo "(yok)"
              echo '```'
              echo "Python/Blender hatalari:"; echo '```'
              grep -nE "Traceback|Error|Exception" model_log.txt | tail -25 || true
              echo '```'
            else
              echo "model_log.txt olusmadi - onceki adim cokmus."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baku-vice-models
          path: |
            out
            model_log.txt
          if-no-files-found: warn

  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: reVC Android catalini cek
        run: |
          git clone --recursive --depth 1 https://github.com/codepdbh/revc-android-port-evolved.git revc
          cd revc && git submodule update --init --recursive --depth 1 || true
          cd ..
          G=$(find revc -maxdepth 3 -name gradlew | head -1)
          if [ -z "$G" ]; then echo "::error::gradlew bulunamadi (proje yapisi farkli)"; find revc -maxdepth 3 | head -50; exit 1; fi
          echo "PROJ=$(dirname "$G")" >> "$GITHUB_ENV"

      - name: SDK, NDK ve lisanslari hazirla
        run: |
          cd "$PROJ"
          chmod +x gradlew
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          CSDK=$(grep -rhoE "compileSdk(Version)?[ =]+[0-9]+" . --include=*.gradle --include=*.kts 2>/dev/null | grep -oE "[0-9]+$" | sort -n | tail -1)
          NDK=$(grep -rhoE "ndkVersion[ =]+['\"][0-9.]+['\"]" . --include=*.gradle --include=*.kts 2>/dev/null | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          echo "compileSdk=$CSDK ndk=$NDK"
          sdkmanager "platform-tools" "build-tools;34.0.0" "cmake;3.22.1" || true
          [ -n "$CSDK" ] && sdkmanager "platforms;android-$CSDK" || sdkmanager "platforms;android-34" || true
          [ -n "$NDK" ] && sdkmanager "ndk;$NDK" || sdkmanager "ndk;26.1.10909125" || true
          grep -q "org.gradle.jvmargs" gradle.properties 2>/dev/null || echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties
          sudo apt-get install -y ninja-build >/dev/null 2>&1 || true

      - name: APK derle
        run: |
          cd "$PROJ"
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode summary 2>&1 | tee "$GITHUB_WORKSPACE/apk_log.txt"

      - name: Hata ozeti
        if: always()
        run: |
          {
            echo "## Hata ozeti - APK"
            if [ -f apk_log.txt ]; then
              if grep -q "BUILD SUCCESSFUL" apk_log.txt; then echo "BUILD SUCCESSFUL"; else
                echo '```'
                grep -nE "What went wrong|Execution failed|error:|fatal error|undefined reference|FAILURE:|Caused by|Could not|not found|SDK location|NDK|CMake Error" apk_log.txt | head -40 || true
                echo '```'
                echo "Son 25 satir:"; echo '```'; tail -25 apk_log.txt; echo '```'
              fi
            else
              echo "apk_log.txt olusmadi - onceki adimlarda hata var (klonlama veya SDK)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baku-vice-apk
          path: |
            revc/**/*.apk
            apk_log.txt
          if-no-files-found: warn
