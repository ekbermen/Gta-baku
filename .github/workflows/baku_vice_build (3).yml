      - name: Modelleri indir (Release "models")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d models ]; then
            mkdir -p models
            gh release download models --repo "$GITHUB_REPOSITORY" --dir models
          fi
          ls -la models/
          for f in LADA_2107.usdz Priora.usdz mercedes-w124-300ce.zip mosque.zip model_flame_towers_baku.usdz baku_heyder_eliyev_merkezi_BAKI.usdz; do
            [ -f "models/$f" ] || { echo "HATA: models/$f eksik. Release 'models' icine yukle."; exit 1; }
          done

      - name: Blender + DragonFF kur
        run: |
          sudo apt-get update -y
          sudo apt-get install -y blender unzip curl
          blender --version | head -1
          BV=$(blender --version | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
          ADDON="$HOME/.config/blender/$BV/scripts/addons"
          mkdir -p "$ADDON"
          curl -L -o dff.zip https://github.com/Parik27/DragonFF/archive/refs/heads/master.zip
          unzip -q dff.zip
          mv DragonFF-master "$ADDON/DragonFF"
          blender -b --python-expr "import bpy; bpy.ops.preferences.addon_enable(module='DragonFF'); bpy.ops.wm.save_userpref(); print('DFF ADDON OK')" || echo "DragonFF etkinlestirilemedi (yedek: obj/blend cikar)"

      - name: Modelleri isle (olcek, sadelestirme, doku)
        run: |
          mkdir -p out
          blender -b --python bv/tools/process_models.py -- bv/config/models.json models out 2>&1 | tee model_log.txt
          python3 bv/tools/gen_gamedata.py bv/config/models.json out/gamedata
          cp -r bv/assets out/assets

      - uses: actions/upload-artifact@v4
        with:
          name: baku-vice-models
          path: |
            out
            model_log.txt

  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: reVC Android catalini cek
        run: |
          git clone --recursive https://github.com/codepdbh/revc-android-port-evolved.git revc
          find revc -maxdepth 3 -name gradlew

      - name: APK derle
        run: |
          G=$(find revc -maxdepth 3 -name gradlew | head -1)
          cd "$(dirname "$G")"
          chmod +x gradlew
          # GameActivity BuildConfig.GAME_FOLDER_NAME istiyor ama build.gradle'da tanimli degil -> ekle
          GR=app/build.gradle
          if ! grep -q GAME_FOLDER_NAME "$GR"; then
            sed -i '0,/defaultConfig {/s//defaultConfig {\n        buildConfigField "String", "GAME_FOLDER_NAME", "\\"reVC\\""/' "$GR"
          fi
          grep -n -B1 -A1 GAME_FOLDER_NAME "$GR" || { echo "HATA: build.gradle yamasi uygulanamadi"; sed -n '1,60p' "$GR"; exit 1; }
          set -o pipefail
          GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx3g" ./gradlew assembleDebug --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/apk_log.txt"

      - name: Hata ozeti
        if: failure()
        run: |
          echo "=== NE YANLIS GITTI ==="
          grep -n -A15 "What went wrong" apk_log.txt | head -60 || true
          echo "=== error satirlari ==="
          grep -n -E "error:|Error:|FAILED|Execution failed|Could not|No such file" apk_log.txt | head -40 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baku-vice-apk
          path: |
            revc/**/*.apk
            apk_log.txt
