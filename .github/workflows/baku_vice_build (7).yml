      - name: Modelleri release (etiket - models) uzerinden indir
        run: |
          mkdir -p models
          if gh release download models --repo "$GITHUB_REPOSITORY" --dir models --clobber; then
            echo "Release 'models' indirildi."
          else
            echo "::warning::Release 'models' indirilemedi, depodaki models/ klasorune bakiliyor."
          fi
          ls -la models
          N=$(ls models | wc -l)
          if [ "$N" -eq 0 ]; then
            echo "::error::models klasoru bos. Release etiketi 'models' olmali ve 6 model dosyasi icermeli."
            exit 1
          fi

      - name: Blender onbellegi
        id: bcache
        uses: actions/cache@v4
        with:
          path: blender
          key: blender-4.2-linux-v1

      - name: Blender indir (hazir paket, apt yok)
        if: steps.bcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p blender
          OK=0
          for V in 4.2.3 4.2.0; do
            if curl -fL --retry 3 -o b.tar.xz "https://download.blender.org/release/Blender4.2/blender-$V-linux-x64.tar.xz"; then OK=1; break; fi
          done
          [ "$OK" = 1 ] || { echo "::error::Blender indirilemedi"; exit 1; }
          tar xf b.tar.xz -C blender --strip-components=1
          rm -f b.tar.xz

      - name: Blender kutuphaneleri + DragonFF
        run: |
          sudo apt-get install -y --no-install-recommends libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 unzip zip >/dev/null 2>&1 || true
          rm -rf dff_src && mkdir dff_src
          URL=$(curl -fsSL https://api.github.com/repos/Parik27/DragonFF/releases/latest | grep -oE '"browser_download_url": *"[^"]+\.zip"' | head -1 | cut -d'"' -f4 || true)
          echo "DragonFF release dosyasi: ${URL:-yok}"
          if [ -n "$URL" ] && curl -fL --retry 3 -o dff_rel.zip "$URL"; then unzip -q dff_rel.zip -d dff_src || true; fi
          if [ -z "$(find dff_src -name __init__.py | head -1)" ]; then
            echo "Release bos, master dali kullaniliyor"
            curl -fL --retry 3 -o dff_master.zip https://github.com/Parik27/DragonFF/archive/refs/heads/master.zip
            unzip -q dff_master.zip -d dff_src
          fi
          INIT=$(find dff_src -maxdepth 3 -name __init__.py | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          ROOT=$(dirname "$INIT")
          echo "DragonFF kok klasoru: $ROOT"; ls "$ROOT" | head -30
          # blender 4.2 eklenti (extension) olarak kur, olmazsa eski usul klasor
          if [ -f "$ROOT/blender_manifest.toml" ]; then
            (cd "$ROOT" && zip -qr "$GITHUB_WORKSPACE/dff_ext.zip" .)
            blender/blender -b --command extension install-file -r user_default --enable "$GITHUB_WORKSPACE/dff_ext.zip" || echo "::warning::extension kurulumu basarisiz, klasor yontemi denenecek"
          fi
          mkdir -p blender_user/addons
          rm -rf blender_user/addons/DragonFF
          cp -r "$ROOT" blender_user/addons/DragonFF
          echo "BLENDER_USER_SCRIPTS=$PWD/blender_user" >> "$GITHUB_ENV"
          echo "$PWD/blender" >> "$GITHUB_PATH"
          blender/blender --version | head -1

      - name: Modelleri isle (olcek, sadelestirme, doku)
        run: |
          mkdir -p out
          set +e
          blender -b --python bv/tools/process_models.py -- bv/config/models.json models out bv/models_proc 2>&1 | tee model_log.txt
          python3 bv/tools/gen_gamedata.py bv/config/models.json out/gamedata
          cp -r bv/assets out/assets
          cp -r bv/server out/server
          exit 0

      - name: Hata ozeti
        if: always()
        run: |
          {
            echo "## Hata ozeti - modeller"
            if [ -f model_log.txt ]; then
              echo "Basarisiz modeller:"; echo '```'
              grep '^REPORT' model_log.txt | grep -E '"ok": false|"dff": false' || echo "(yok)"
              echo '```'
              echo "Python/Blender hatalari:"; echo '```'
              grep -nE "Traceback|Error|Exception" model_log.txt | tail -25 || true
              echo '```'
            else
              echo "model_log.txt olusmadi - onceki adim cokmus."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baku-vice-models
          path: |
            out
            model_log.txt
          if-no-files-found: warn

  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: reVC Android catalini cek
        run: |
          git clone --recursive --depth 1 https://github.com/codepdbh/revc-android-port-evolved.git revc
          cd revc && git submodule update --init --recursive --depth 1 || true
          cd ..
          G=$(find revc -maxdepth 3 -name gradlew | head -1)
          if [ -z "$G" ]; then echo "::error::gradlew bulunamadi (proje yapisi farkli)"; find revc -maxdepth 3 | head -50; exit 1; fi
          echo "PROJ=$(dirname "$G")" >> "$GITHUB_ENV"

      - name: SDK, NDK ve lisanslari hazirla
        run: |
          cd "$PROJ"
          chmod +x gradlew
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          echo "sdkmanager=$SDKM"
          [ -n "$SDKM" ] || { echo "::error::sdkmanager bulunamadi"; ls "$ANDROID_HOME" "$ANDROID_HOME/cmdline-tools"; exit 1; }
          sdkmanager() { "$SDKM" "$@"; }
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          CSDK=$(grep -rhoE "compileSdk(Version)?[ =]+[0-9]+" . --include=*.gradle --include=*.kts 2>/dev/null | grep -oE "[0-9]+$" | sort -n | tail -1)
          NDK=$(grep -rhoE "ndkVersion[ =]+['\"][0-9.]+['\"]" . --include=*.gradle --include=*.kts 2>/dev/null | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          echo "compileSdk=$CSDK ndk=$NDK"
          sdkmanager "platform-tools" "build-tools;34.0.0" "cmake;3.22.1" || true
          [ -n "$CSDK" ] && sdkmanager "platforms;android-$CSDK" || sdkmanager "platforms;android-34" || true
          [ -n "$NDK" ] && sdkmanager "ndk;$NDK" || sdkmanager "ndk;26.1.10909125" || true
          grep -q "org.gradle.jvmargs" gradle.properties 2>/dev/null || echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties
          sudo apt-get install -y ninja-build >/dev/null 2>&1 || true

      - name: BuildConfig onar ve dogru Gradle gorevini sec
        run: |
          cd "$PROJ"
          echo "--- flavor / BuildConfig satirlari ---"
          grep -rnE "GAME_FOLDER_NAME|productFlavors|flavorDimensions|buildConfigField|buildConfig " . --include=*.gradle --include=*.kts | head -40 || true
          APPG=$(ls app/build.gradle app/build.gradle.kts 2>/dev/null | head -1)
          echo "app gradle: $APPG"
          # 1) GAME_FOLDER_NAME hic tanimli degilse standart surum icin ekle
          if [ -n "$APPG" ] && ! grep -rq "GAME_FOLDER_NAME" . --include=*.gradle --include=*.kts; then
            echo "::warning::GAME_FOLDER_NAME tanimsiz; defaultConfig'e 'reVC' olarak ekleniyor"
            if [[ "$APPG" == *.kts ]]; then
              sed -i '0,/defaultConfig {/s//defaultConfig {\n        buildConfigField("String", "GAME_FOLDER_NAME", "\\"reVC\\"")/' "$APPG"
              grep -q "buildConfig = true" "$APPG" || sed -i '0,/android {/s//android {\n    buildFeatures { buildConfig = true }/' "$APPG"
            else
              sed -i '0,/defaultConfig {/s//defaultConfig {\n        buildConfigField "String", "GAME_FOLDER_NAME", "\\"reVC\\""/' "$APPG"
              grep -q "buildConfig true" "$APPG" || sed -i '0,/android {/s//android {\n    buildFeatures { buildConfig true }/' "$APPG"
            fi
            sed -n '1,60p' "$APPG"
          fi
          # 2) flavor varsa standart (reVC) surumunu sec: longnight/gta3 olmayan ilk assemble*Debug
          ./gradlew -q :app:tasks --all --no-daemon 2>/dev/null | grep -oE "^assemble[A-Za-z0-9]*Debug" | sort -u | tee tasks.txt || true
          TASK=$(grep -viE "longnight|gta3|gtaiii|lcs|^assembleDebug$" tasks.txt | head -1)
          [ -n "$TASK" ] || TASK=assembleDebug
          echo "Secilen gorev: $TASK"
          echo "TASK=$TASK" >> "$GITHUB_ENV"

      - name: APK derle
        run: |
          cd "$PROJ"
          set +e
          ./gradlew $TASK --no-daemon --stacktrace --warning-mode summary 2>&1 | tee "$GITHUB_WORKSPACE/apk_log.txt"
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            echo ""; echo "=================== HATA OZETI (BUNU YAPISTIR) ==================="
            grep -nE "> Task .* FAILED|FAILED$" "$GITHUB_WORKSPACE/apk_log.txt" | head -10
            grep -n -A14 "What went wrong" "$GITHUB_WORKSPACE/apk_log.txt" | head -50
            grep -nE "error:|fatal error|undefined reference|CMake Error|ninja: error|Execution failed" "$GITHUB_WORKSPACE/apk_log.txt" | head -30
            echo "=================================================================="
          fi
          exit $RC

      - name: Yedek - hazir APK'leri releaselerden indir (derleme basarisizsa)
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p prebuilt
          gh release download --repo codepdbh/revc-android-port-evolved --pattern '*.apk' --dir prebuilt --clobber
          ls -la prebuilt

      - name: Hata ozeti
        if: always()
        run: |
          {
            echo "## Hata ozeti - APK"
            if [ -f apk_log.txt ]; then
              if grep -q "BUILD SUCCESSFUL" apk_log.txt; then echo "BUILD SUCCESSFUL"; else
                echo '```'
                grep -n -A14 "What went wrong" apk_log.txt | head -40 || true
                grep -nE "error:|fatal error|undefined reference|CMake Error|ninja: error|Execution failed|FAILED$" apk_log.txt | head -30 || true
                echo '```'
                echo "Son 25 satir:"; echo '```'; tail -25 apk_log.txt; echo '```'
              fi
            else
              echo "apk_log.txt olusmadi - onceki adimlarda hata var (klonlama veya SDK)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baku-vice-apk
          path: |
            revc/**/*.apk
            prebuilt/*.apk
            apk_log.txt
          if-no-files-found: warn
